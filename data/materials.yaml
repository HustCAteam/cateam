# 素材台账：记录来源与公开边界，不代表授予第三方素材再分发许可。
reviewed_on: "2026-10-13"
policy:
  - 原始文件保持不动；网站仅发布以下经过筛选的派生图片。
  - 不发布私人聊天、手机号、私人表单、人脸合照、设备序列号或旧群二维码。
  - 宣传插画不是活动实拍；历史材料不是当前活动、维修服务或招新岗位承诺。
  - 图片均重新编码，不携带原始 EXIF、设备定位或聊天界面。
  - 二维码保留原件像素，不重新生成；PNG 无损是指对 JPEG 解码像素无新增有损压缩。
  - 二维码解码一致性不等于验证 QQ 加群链接长期有效，使用时以 QQ 客户端为准。
assets:
  - id: ca-logo
    source: "~/Downloads/CA_logo/CA_原版.png"
    source_size: [904, 904]
    meaning: CA 原版蓝绿渐变标志
    processing: 等比例缩小至 512×512，保留原有透明通道、轮廓和配色；WebP 使用无损编码。
    restrictions: 不从宣传海报重画 Logo，不将透明部分填为黑色。
    outputs:
      - {path: /media/ca-logo.png, width: 512, height: 512, bytes: 16443}
      - {path: /media/ca-logo.webp, width: 512, height: 512, bytes: 10860}
      - {path: /favicon-16x16.png, width: 16, height: 16, bytes: 699}
      - {path: /favicon-32x32.png, width: 32, height: 32, bytes: 1418}
      - {path: /favicon-48x48.png, width: 48, height: 48, bytes: 1871}
      - {path: /favicon-192x192.png, width: 192, height: 192, bytes: 6819}
      - {path: /favicon-512x512.png, width: 512, height: 512, bytes: 16443}
      - path: /favicon.ico
        sizes: [16, 32, 48, 64, 128, 256]
        bytes: 22901
      - path: /apple-touch-icon.png
        width: 180
        height: 180
        bytes: 5547
        processing: 156×156 原版 Logo 居中放置于 180×180 白底，适配 Apple touch icon。
