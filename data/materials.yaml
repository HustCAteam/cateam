        meaning: 宣传海报中的笔记本与校园插画局部，用于首页视觉入口。
    qr_check:
      decoder: zbarimg
      result: 原图整图直接扫描未解出；对两块二维码区域裁切并放大、灰度阈值辅助识别，原图与 WebP 均解出相同的两条链接。
      original_crop_boxes: [[42, 1340, 154, 1454], [180, 1340, 294, 1454]]
      decoding_only_processing: 放大 5 倍，尝试最近邻或双三次采样及灰度阈值 180、200、220；这些诊断变体不发布。
      targets: ["https://qm.qq.com/q/87AAtvpbGM", "https://qm.qq.com/q/8Ra61Zy3W8"]
