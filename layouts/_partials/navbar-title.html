{{- /* Adapted from gentoozh-theme's accessible navbar-title (MIT).
      Keep the full association name as the link label and a compact visible brand. */ -}}
<a class="hx:flex hx:items-center hx:hover:opacity-75 hx:ltr:mr-auto hx:rtl:ml-auto" href="{{ .Site.Home.RelPermalink }}" aria-label="{{ .Site.Title }}">
  <img class="hx:mr-2" src="{{ .Site.Params.navbar.logo.path | relURL }}" alt="" height="{{ .Site.Params.navbar.logo.height }}" width="{{ .Site.Params.navbar.logo.width }}" />
  <span class="hx:mr-2 hx:font-extrabold hx:inline hx:select-none">HUST CA</span>
</a>
