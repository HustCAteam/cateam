name: Temporary HTTPS diagnosis
on:
  push:
    branches: [docs/mainpage-contribution]
permissions: {}
jobs:
  network:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect DNS and verified HTTPS routes
        shell: bash
        run: |
          set +e
          set -u
          getent ahosts hustca.cn
          probe() {
            printf '\n=== %s ===\n' "$1"
            shift
            curl --verbose --fail --silent --show-error --connect-timeout 15 --max-time 30 --output /dev/null --write-out '\nHTTP %{http_code} remote=%{remote_ip} verify=%{ssl_verify_result}\n' "$@"
            printf 'curl_exit=%s\n' "$?"
          }
          probe normal https://hustca.cn:404/
          probe ipv4 --ipv4 https://hustca.cn:404/
          probe direct-server --resolve hustca.cn:404:121.40.128.93 https://hustca.cn:404/
          probe standard-https https://hustca.cn/
