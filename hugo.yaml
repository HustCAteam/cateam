baseURL: https://hustca.cn/
languageCode: zh-CN
defaultContentLanguage: zh-cn
title: 华中科技大学计算机协会
hasCJKLanguage: true
enableRobotsTXT: true
module:
  imports:
    - path: github.com/Gentoo-zh/gentoozh-theme
params:
  page:
    width: wide
  description: 华中科技大学计算机协会 HUST CA。技术交流、项目实践与经验分享，在这里找到一起学习、一起创造的人。
  images:
    - /media/ca-logo.png
  dateFormat: "2006-01-02"
  navbar:
    displayTitle: true
    displayLogo: true
    width: wide
    logo:
      path: /media/ca-logo.webp
      dark: /media/ca-logo.webp
      width: 28
      height: 28
  theme:
    default: system
    displayToggle: true
  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
      tokenize: forward
  blog:
    list:
      sortBy: date
      sortOrder: desc
      pagerSize: 9
      displayTags: true
  editURL:
    enable: true
    base: https://github.com/HustCAteam/cateam/edit/main/content
  footer:
    enable: true
    width: wide
  sameAs:
    - https://github.com/HustCAteam
menu:
  main:
    - name: 认识计协
      pageRef: /about
      weight: 10
    - name: 项目
      pageRef: /projects
      weight: 20
    - name: 文章
      pageRef: /posts
      weight: 30
    - name: 共学
      pageRef: /docs
      weight: 40
    - name: 加入我们
      pageRef: /join
      weight: 50
    - name: 更多
      identifier: more
      weight: 60
    - name: 共建方向
      parent: more
      pageRef: /contributors
      weight: 1
    - name: 网站共建
      parent: more
      pageRef: /contributing
      weight: 2
    - name: RSS 订阅
      parent: more
      url: /feed.xml
      weight: 3
    - name: 搜索
      weight: 70
      params:
        type: search
    - name: GitHub
      url: https://github.com/HustCAteam
      weight: 80
      params:
        icon: github
    - identifier: theme-toggle
      weight: 90
      params:
        type: theme-toggle
markup:
  highlight:
    noClasses: false
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 2
    endLevel: 3
outputs:
  home: [HTML, RSS]
  section: [HTML]
outputFormats:
  RSS:
    baseName: feed
taxonomies:
  tag: tags
